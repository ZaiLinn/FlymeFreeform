name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 依赖 + wrapper + Kotlin 编译缓存，命中时构建从 4 分钟降到 1 分钟左右。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.kotlin
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Starter safety and unit tests
        run: |
          sh scripts/test-starter-safety.sh
          sh gradlew :app:compileReleaseKotlin :app:testDebugUnitTest --build-cache --stacktrace

      - name: Assemble release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --stacktrace

      - name: Show output
        run: ls -l app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlymeFreeform-apk
          path: app/build/outputs/apk/release/*.apk
